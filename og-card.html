<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>og.png source</title>
  <!-- Source for og.png, the 1200x630 link-preview image LinkedIn, Slack and
       others show when the site is shared. Regenerate after editing:
         chromium --headless --hide-scrollbars --window-size=1200,630 \
           --screenshot="$PWD/og.png" "file://$PWD/og-card.html"          -->
  <style>
    @font-face { font-family: "Geist"; src: url("fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Geist Mono"; src: url("fonts/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 72px 80px;
      background:
        radial-gradient(900px 500px at 100% 0%, #0e2a27, transparent 70%),
        #0b0e12;
      color: #e8ebf0;
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .top { display: flex; align-items: center; gap: 18px; font: 600 26px/1 "Geist Mono", ui-monospace, monospace; color: #4fd1c0; letter-spacing: 0.04em; }
    .mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; background: #5fd4c4; color: #0a0c10; font-size: 26px; }
    h1 { margin: 0; font-size: 108px; font-weight: 650; letter-spacing: -0.05em; line-height: 1; }
    p { margin: 22px 0 0; max-width: 980px; font-size: 38px; line-height: 1.3; color: #9aa2b2; }
    .bottom { display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: #9aa2b2; }
    .status { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border: 1px solid #232a35; border-radius: 999px; background: #131820; color: #e8ebf0; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #22c55e; }
    .url { font-family: "Geist Mono", ui-monospace, monospace; color: #4fd1c0; }
  </style>
</head>
<body>
  <div class="top"><span class="mark">&gt;_</span>CS · University of Louisville</div>
  <div>
    <h1>Andrew Merritt</h1>
    <p>Detection-engineering tooling, autonomous AI agents, and quantitative systems.</p>
  </div>
  <div class="bottom">
    <span class="status"><span class="dot"></span>Seeking a Summer 2027 SWE internship</span>
    <span class="url">a0merr.github.io</span>
  </div>
</body>
</html>
